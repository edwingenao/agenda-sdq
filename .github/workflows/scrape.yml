name: scrape

on:
  schedule:
    - cron: "17 10 * * *" # 06:17 en Santo Domingo (UTC-4)
  workflow_dispatch:

permissions:
  contents: write

# Una sola corrida a la vez: dos corridas seguidas (la programada y una a mano) se pisaban al publicar.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt anthropic
      - name: Restaurar caché de páginas (evita reprocesar lo que no cambió)
        uses: actions/cache@v4
        with:
          path: data/agenda.db
          key: agenda-db-${{ github.run_id }}
          restore-keys: agenda-db-
      - run: python -m agenda run
        env:
          AGENDA_CONTACT: ${{ vars.AGENDA_CONTACT }}
          # Extracción con IA (Acento Cultural). Sin el secreto ANTHROPIC_API_KEY esa fuente no publica nada.
          AGENDA_LLM: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publicar events.json y venues.json
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add docs/events.json docs/venues.json
          git diff --staged --quiet || {
            git commit -m "Actualizar eventos"
            # Si alguien subió algo a main mientras corría (un cambio de código, el CNAME...), se integra y se reintenta.
            # Los JSON de esta corrida mandan sobre los de la rama.
            git pull --rebase -X theirs origin main && git push
          }
      - name: Avisar si alguna fuente falló
        if: always()
        run: |
          if [ -s data/alerta.txt ]; then
            { echo "## Fuentes con problemas"; cat data/alerta.txt; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Alguna fuente falló: revisa el resumen de la corrida."
            exit 1
          fi
